name: Train

# Manual run. Downloads a WikiArt subset, trains the classical baseline and the
# ResNet-18 fine-tune on CPU, and uploads metrics + confusion matrices.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Smoke run (2 artists, 20 images each, 1 epoch)"
        type: boolean
        default: false
      per_artist:
        description: "Images per artist (full run)"
        default: "150"
      max_artists:
        description: "Number of artists (full run)"
        default: "10"
      epochs:
        description: "CNN epochs (full run)"
        default: "8"
      arch:
        description: "CNN architecture"
        type: choice
        options: [resnet18, efficientnet_b0]
        default: resnet18

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data]"
      - name: Download WikiArt subset
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            python -m renart download --smoke --data data/run
          else
            python -m renart download --data data/run \
              --per-artist "${{ inputs.per_artist }}" --max-artists "${{ inputs.max_artists }}"
          fi
          cat data/run/dataset_stats.json
      - name: Train classical baseline
        run: |
          python -m renart train-baseline --data data/run --out results --classifier logreg
          python -m renart train-baseline --data data/run --out results --classifier forest
      - name: Train CNN
        run: |
          EPOCHS="${{ inputs.epochs }}"
          if [ "${{ inputs.smoke }}" = "true" ]; then EPOCHS=1; fi
          python -m renart train-cnn --data data/run --out results \
            --epochs "$EPOCHS" --arch "${{ inputs.arch }}" --workers 2
      - name: Report
        run: |
          cp data/run/dataset_stats.json results/
          python -m renart report results/metrics_*.json | tee results/comparison.md
          {
            echo "## Results (smoke=${{ inputs.smoke }})"
            echo
            cat results/comparison.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_number }}
          path: |
            results/*.json
            results/*.png
            results/*.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: results/cnn.pt
          retention-days: 14
