[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renart"
version = "0.2.0"
description = "Style-based artist attribution for Renaissance paintings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pillow>=10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["huggingface_hub>=0.23", "pyarrow>=14", "datasets>=2.19"]
train = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
renart = "renart.cli:main"

[tool.setuptools.packages.find]
include = ["renart*"]

[tool.setuptools.package-data]
renart = ["site_template.html"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
